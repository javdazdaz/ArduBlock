{% extends "base.html" %}
{% block title %}{{ _('new_password_title') }} — ArduBlock{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="card">
  <h1>🔒 {{ _('new_password_title') }}</h1>
  {{ render_flash() }}
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="field">
      <label for="password">{{ _('new_password_label') }}</label>
      {{ form.password() }}
    </div>
    <button type="submit" class="btn btn-block">{{ _('change_password') }}</button>
  </form>
</div>
{% endblock %}
