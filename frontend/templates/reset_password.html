<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — ArduBlock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #16213e; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.08); }
    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.85rem; color: #a0a0b0; margin-bottom: 0.3rem; }
    .field input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: #1a1a2e; color: #eee; font-size: 0.95rem; }
    .field input:focus { outline: none; border-color: #e94560; }
    .btn { width: 100%; padding: 0.7rem; border: none; border-radius: 6px; background: #e94560; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { opacity: 0.9; }
    .flash { padding: 0.5rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
    .flash.error { background: rgba(233,69,96,0.15); color: #e94560; }
  </style>
</head>
<body>

<div class="card">
  <h1>🔒 Nueva contraseña</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="field">
      <label for="password">Nueva contraseña (mínimo 6 caracteres)</label>
      {{ form.password() }}
    </div>
    <button type="submit" class="btn">Cambiar contraseña</button>
  </form>
</div>

</body>
</html>
