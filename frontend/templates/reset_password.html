{% extends "base.html" %}
{% block title %}Nueva contraseña — ArduBlock{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="card">
  <h1>🔒 Nueva contraseña</h1>
  {{ render_flash() }}
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="field">
      <label for="password">Nueva contraseña (mínimo 6 caracteres)</label>
      {{ form.password() }}
    </div>
    <button type="submit" class="btn btn-block">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
