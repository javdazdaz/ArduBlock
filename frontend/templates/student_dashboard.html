<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis proyectos — ArduBlock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #16213e; border-bottom: 1px solid rgba(255,255,255,0.05); }
    nav h1 { font-size: 1.2rem; }
    nav a { color: #a0a0b0; text-decoration: none; font-size: 0.9rem; margin-left: 1rem; }
    nav a:hover { color: #e94560; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header h2 { font-size: 1.3rem; }
    .btn-new { padding: 0.6rem 1.5rem; border-radius: 6px; background: #e94560; color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .btn-new:hover { opacity: 0.9; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .project-card {
      background: #16213e; border-radius: 10px; padding: 1.2rem;
      border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: border-color 0.15s;
      text-decoration: none; color: inherit; display: block;
    }
    .project-card:hover { border-color: #e94560; }
    .project-card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
    .project-card .board { font-size: 0.75rem; color: #e94560; margin-bottom: 0.5rem; }
    .project-card .meta { font-size: 0.75rem; color: #666; }
    .empty { text-align: center; color: #666; padding: 3rem; }
    .empty p { margin-bottom: 1rem; }
  </style>
</head>
<body>

<nav>
  <h1>⚡ ArduBlock</h1>
  <div>
    <span style="color:#a0a0b0;font-size:0.9rem">{{ user.name }}</span>
    <a href="{{ url_for('auth.logout') }}">Salir</a>
  </div>
</nav>

<main>
  <div class="header">
    <h2>Mis proyectos</h2>
    <a href="/app" class="btn-new">+ Nuevo proyecto</a>
  </div>

  {% if projects %}
    <div class="project-grid">
      {% for p in projects %}
        <a href="/app?project={{ p.id }}" class="project-card">
          <h3>{{ p.name }}</h3>
          <div class="board">{{ p.board }}</div>
          <div class="meta">{{ p.updated_at.strftime('%d/%m/%Y %H:%M') if p.updated_at else '' }}</div>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <div class="empty">
      <p>Aún no tienes proyectos.</p>
      <a href="/app" class="btn-new">Crear mi primer proyecto</a>
    </div>
  {% endif %}
</main>

</body>
</html>
