{% extends "base.html" %}
{% block title %}Recuperar contraseña — ArduBlock{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="card">
  <h1>🔑 Recuperar contraseña</h1>
  {{ render_flash() }}
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="field">
      <label for="email">Email de tu cuenta</label>
      {{ form.email() }}
    </div>
    <button type="submit" class="btn btn-block">Enviar instrucciones</button>
  </form>
  <div class="footer">
    <a href="{{ url_for('auth.login') }}">← Volver al login</a>
  </div>
</div>
{% endblock %}
