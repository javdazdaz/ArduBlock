<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArduBlock — Programación Visual para Arduino</title>
  <meta name="description" content="Entorno de programación visual basado en bloques para Arduino. Diseñado para educación.">
  <link rel="canonical" href="https://ardublock.matemancia.net/">
  <meta property="og:title" content="ArduBlock">
  <meta property="og:description" content="Del bloque al código C++. Programa Arduino arrastrando bloques.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      display: flex;
      justify-content: flex-end;
      padding: 1.25rem 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      background: #e94560;
      color: #fff;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    .tagline {
      font-size: 1.15rem;
      color: #a0a0b0;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: #666;
    }
    footer a { color: #888; }
  </style>
</head>
<body>

<nav>
  <a href="/app" class="btn">Abrir editor</a>
</nav>

<main>
  <h1>⚡ ArduBlock</h1>
  <p class="tagline">
    Programación visual para Arduino. Arrastra bloques, genera C++,
    compila y sube directo a la placa. Diseñado para el aula,
    integrado con Chamilo vía LTI&nbsp;1.3.
  </p>
</main>

<footer>
  Prototipo en desarrollo ·
  <a href="https://github.com/javdazdaz/ArduBlock">github.com/javdazdaz/ArduBlock</a>
</footer>

</body>
</html>
