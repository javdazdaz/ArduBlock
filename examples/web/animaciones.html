<!--
name: Animaciones
description: Animaciones con CSS y JavaScript: pulso, carga, texto máquina y pelota.
category: Visual
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animaciones</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:400px}
  h1{font-size:1.2rem;margin:0 0 16px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .label{font-size:.85rem;color:var(--muted);flex:0 0 90px}
  .dot{width:18px;height:18px;border-radius:50%;background:#ff5555;animation:pulso 1s infinite}
  @keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.6)}}
  .bar{flex:1;height:10px;background:#21262d;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#4ade80;animation:carga 3s infinite}
  @keyframes carga{0%{width:0}80%{width:100%}100%{width:100%}}
  #maquina{font-family:monospace;font-size:1rem;color:#4ade80;min-height:1.4em}
  .bounce{width:24px;height:24px;border-radius:50%;background:#fbbf24;animation:rebote 1.2s infinite}
  @keyframes rebote{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  .spinner{width:28px;height:28px;border:4px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:girar 1s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>✨ Animaciones</h1>
  <div class="row"><span class="label">Pulso</span><span class="dot"></span></div>
  <div class="row"><span class="label">Carga</span><span class="bar"><i></i></span></div>
  <div class="row"><span class="label">Texto</span><span id="maquina"></span></div>
  <div class="row"><span class="label">Rebote</span><span class="bounce"></span></div>
  <div class="row"><span class="label">Giro</span><span class="spinner"></span></div>
</div>
<script>
var t='¡Hola desde Arduino!',i=0,m=document.getElementById('maquina');
setInterval(function(){m.textContent=t.slice(0,i);i=(i+1)%(t.length+1)},150);
</script>
</body>
</html>
