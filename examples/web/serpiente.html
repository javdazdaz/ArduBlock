<!--
name: Serpiente
description: Juego de la serpiente en canvas. Muévala con las flechas.
category: Juegos
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpiente</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center}
  canvas{background:#161b22;border:2px solid #30363d;display:block;margin:0 auto}
  h1{font-size:1.2rem;margin:0 0 6px}
  .score{font-size:1rem;margin-bottom:10px}
  .hint{font-size:.72rem;color:#8b949e;margin:12px auto 0;max-width:400px;text-align:left;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 Serpiente</h1>
  <div class="score">Puntos: <span id="s">0</span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <p class="hint"><strong>Cómo</strong><br>
    1. No requiere componentes.<br>
    2. Publique la página en la red del Arduino con <code>desplegar página web del archivo</code>.<br>
    3. Juegue con las flechas.</p>
</div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var N=20,CELL=cv.width/N;
var snake=[{x:10,y:10}],dir={x:1,y:0},food=poner(),score=0,over=false;
function poner(){return{x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
function paso(){
  if(over)return;
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  for(var i=0;i<snake.length;i++){if(snake[i].x===h.x&&snake[i].y===h.y){over=true;return}}
  if(h.x<0||h.x>=N||h.y<0||h.y>=N){over=true;return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;document.getElementById('s').textContent=score;food=poner()}
  else snake.pop();
}
function dibujar(){
  ctx.fillStyle='#161b22';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ff5555';ctx.fillRect(food.x*CELL,food.y*CELL,CELL,CELL);
  ctx.fillStyle='#4ade80';
  for(var i=0;i<snake.length;i++)ctx.fillRect(snake[i].x*CELL,snake[i].y*CELL,CELL,CELL);
  if(over){ctx.fillStyle='#fff';ctx.font='20px system-ui';ctx.fillText('Fin — recargue para jugar',70,200)}
}
addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};
  else if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:1};
  else if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};
  else if(e.key==='ArrowRight'&&dir.x===0)dir={x:1,y:0};
});
setInterval(function(){paso();dibujar()},120);
</script>
</body>
</html>
